<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1450">
    <title>Meta Formazioni | Inazuma Eleven Cross</title>
    <link rel="icon" type="image/png" href="img/IECross.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleCharacter.css">
    <link rel="stylesheet" href="css/styleTeamBuilder.css">

    <style>
        .tier-row { display: flex; margin-bottom: 10px; border-radius: 8px; overflow: hidden; background-color: #0b1a42; border: 2px solid #1269e8; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .tier-label { width: 120px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); flex-shrink: 0; border-right: 2px solid #1269e8; }
        .tier-SS { background-color: #ffc107; color: #000; text-shadow: none; }
        .tier-S { background-color: #dc3545; }
        .tier-A { background-color: #198754; }
        .tier-B { background-color: #0d6efd; }
        .tier-content { padding: 15px; display: flex; flex-wrap: wrap; gap: 15px; flex-grow: 1; min-height: 110px; }

        .formation-card { background: #e4edf8; border: 2px solid #c0d3e8; border-radius: 8px; padding: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; width: 300px; }
        .formation-card:hover { transform: scale(1.05); border-color: #1a73e8; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .formation-card img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 2px solid #102247; }

        .draft-mini-icon { width: 40px; height: 40px; border-radius: 4px; border: 1px solid #fff; object-fit: cover; }

        .pulse-icon { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="pb-5">

<script type="module" src="js/Components/navbar.js"></script>
<inazuma-navbar></inazuma-navbar>

<div class="container-fixed py-4" style="max-width: 1200px !important;">
    <h2 class="text-white text-center fw-bold mb-4 mt-3" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 2px;">
        <i class="fas fa-crown text-warning me-2"></i> Meta Formazioni
    </h2>

    <div id="admin-panel-container" style="display: none; margin-bottom: 40px;">
        <div class="card p-4 shadow-lg" style="border: 3px solid #ffc107;">
            <h4 class="fw-bold text-warning border-bottom border-warning pb-2 mb-4">
                <i class="fas fa-upload me-2"></i> Pubblica Nuova Meta Formazione
            </h4>
            <div class="mb-4 p-3 rounded" style="background-color: #0b1a42; border: 2px solid #1269e8;">
                <h6 class="text-info fw-bold mb-2">Anteprima Squadra da Pubblicare:</h6>
                <div id="draft-preview" class="d-flex flex-wrap gap-2 align-items-center"></div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="fw-bold mb-1 text-dark">Tier Competitivo</label>
                    <div class="custom-select" id="formation-tier" data-value="S">
                        <div class="select-selected"><span class="fw-bold" style="color: #dc3545;">S</span> <i class="fas fa-chevron-down"></i></div>
                        <div class="select-items select-hide">
                            <div data-value="SS"><span class="fw-bold" style="color: #ffc107;">SS</span></div>
                            <div data-value="S"><span class="fw-bold" style="color: #dc3545;">S</span></div>
                            <div data-value="A"><span class="fw-bold" style="color: #198754;">A</span></div>
                            <div data-value="B"><span class="fw-bold" style="color: #0d6efd;">B</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <label class="fw-bold mb-1 text-dark">Titolo Formazione</label>
                    <input type="text" id="formation-title" class="form-control" style="border: 2px solid #c0d3e8; font-weight: bold;">
                </div>
                <div class="col-12 mt-3">
                    <label class="fw-bold mb-1 text-dark">Spiegazione Generale</label>
                    <textarea id="formation-desc" class="form-control" rows="4" style="border: 2px solid #c0d3e8; font-weight: 500;"></textarea>
                </div>
            </div>
            <div class="text-end border-top pt-3">
                <button id="btn-save-formation" class="btn btn-primary fw-bold px-5 fs-5 shadow"><i class="fas fa-save me-2"></i> Salva nel Meta</button>
                <button id="btn-cancel-draft" class="btn btn-danger fw-bold ms-2">Annulla</button>
            </div>
        </div>
    </div>

    <div id="loading-spinner" class="text-center p-5 text-white">
        <i class="fas fa-spinner fa-spin fa-3x"></i><br><h5 class="mt-3">Caricamento Formazioni...</h5>
    </div>

    <div id="tier-list-container" style="display: none;">
        <div class="tier-row"><div class="tier-label tier-SS">SS</div><div class="tier-content" id="tier-SS"></div></div>
        <div class="tier-row"><div class="tier-label tier-S">S</div><div class="tier-content" id="tier-S"></div></div>
        <div class="tier-row"><div class="tier-label tier-A">A</div><div class="tier-content" id="tier-A"></div></div>
        <div class="tier-row"><div class="tier-label tier-B">B</div><div class="tier-content" id="tier-B"></div></div>
    </div>
</div>

<!-- MODALE VISUALIZZAZIONE CAMPO INTERATTIVO -->
<div class="modal fade" id="formationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-white" style="border: 3px solid #1a73e8; border-radius: 12px; overflow: hidden; height: 90vh;">

            <div class="modal-header" style="background-color: #0b1a42; color: #fff; border-bottom: 2px solid #1a73e8;">
                <div class="d-flex align-items-center gap-3">
                    <div class="text-center">
                        <span class="badge bg-warning text-dark mb-1">Allenatore</span><br>
                        <img id="view-coach-thumb" src="" style="width: 50px; border-radius: 6px; border: 2px solid #ffca28;">
                    </div>
                    <div>
                        <h4 class="modal-title fw-bold text-uppercase m-0" id="view-formation-title" style="color: #ffca28;">Titolo Squadra</h4>
                        <small class="fw-bold" id="view-coach-name"></small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-0" style="background-color: #f8fbff; overflow: hidden;">
                <div class="row m-0 h-100">

                    <!-- COLONNA SINISTRA: IL CAMPO (Divisa esattamente a metà per dare spazio al campo da 500px) -->
                    <div class="col-lg-6 d-flex align-items-center justify-content-center p-0" style="background-color: #051024; border-right: 3px solid #1a73e8;">
                        <div class="pitch-container-wrapper" style="width: 100%; height: 100%; padding: 20px;">
                            <!-- Il CSS del TeamBuilder applica "position: relative; width: 500px; height: 557px;" alla classe .pitch -->
                            <div id="view-pitch-container" class="pitch">
                                <!-- Giocatori iniettati dal JS -->
                            </div>
                        </div>
                    </div>

                    <!-- COLONNA DESTRA: STRATEGIA E BUILD -->
                    <div class="col-lg-6 p-4" style="overflow-y: auto; height: 100%;">

                        <!-- Box Strategia dell'allenatore -->
                        <div class="mb-4 bg-white p-3 rounded shadow-sm" style="border: 1px solid #c0d3e8; border-left: 5px solid #1a73e8;">
                            <h5 class="fw-bold text-primary mb-2"><i class="fas fa-chess-board me-2"></i>Descrizione</h5>
                            <p id="view-formation-desc" class="fs-6 fw-bold m-0" style="color: #102247; line-height: 1.5; white-space: pre-wrap;"></p>
                        </div>

                        <!-- Pannello Dinamico della Build -->
                        <div id="view-build-details" class="p-4 rounded shadow-sm h-100 d-flex flex-column align-items-center justify-content-center" style="background-color: #0b1a42; border: 2px solid #1269e8; color: #fff; min-height: 350px;">
                            <i class="fas fa-hand-pointer fa-4x text-info mb-3 pulse-icon"></i>
                            <h4 class="text-center fw-bold">Clicca su un giocatore in campo<br>per visualizzare la sua Meta Build!</h4>
                        </div>

                    </div>
                </div>
            </div>

            <div class="modal-footer d-flex justify-content-between" style="background-color: #e4edf8; border-top: 1px solid #b0c4de;">
                <button id="btn-delete-formation" class="btn btn-danger fw-bold" style="display: none;"><i class="fas fa-trash me-1"></i> Elimina Formazione</button>
                <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Chiudi</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    const app = initializeApp({
        apiKey: "AIzaSyDJLzxu2tREehzZE79YAK7_TIq1G6lf4Rc",
        authDomain: "inazumaelevencrosshub.firebaseapp.com",
        projectId: "inazumaelevencrosshub"
    });
    window.firebaseDb = getFirestore(app);
    window.firebaseAuth = getAuth(app);
    window.firebaseOnAuth = onAuthStateChanged;
    window.dbCollection = collection; window.dbGetDocs = getDocs; window.dbDoc = doc; window.dbSet = setDoc; window.dbDelete = deleteDoc;
</script>

<script type="module" src="js/Controllers/metaTeam.js"></script>
</body>
</html>
