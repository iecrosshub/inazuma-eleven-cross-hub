<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1450">
    <title>Discussione | Inazuma Eleven Cross</title>
    <link rel="icon" type="image/png" href="img/IECross.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleCommunity.css">
    <link rel="stylesheet" href="css/styleTeamBuilder.css">
</head>
<body class="pb-5">

<script type="module" src="js/Components/navbar.js"></script>
<inazuma-navbar></inazuma-navbar>

<div class="container-fixed py-4" style="width: 1000px !important; max-width: 1000px !important;">

    <!-- Pulsante Indietro -->
    <div class="mb-3">
        <button onclick="window.history.back()" class="btn btn-light fw-bold text-primary shadow-sm" style="border: 2px solid #c0d3e8;">
            <i class="fas fa-arrow-left me-2"></i> Torna Indietro
        </button>
    </div>

    <!-- ZONA 1: IL POST ORIGINALE (Viene disegnato dal JS in base al 'type') -->
    <div id="original-post-container" class="mb-4">
        <div class="text-center p-5 bg-white rounded shadow-sm border" style="border-color: #c0d3e8 !important;">
            <i class="fas fa-spinner fa-spin fa-3x text-primary mb-3"></i>
            <h5 class="text-primary fw-bold">Caricamento discussione in corso...</h5>
        </div>
    </div>

    <!-- ZONA 2: I COMMENTI E LE RISPOSTE -->
    <div class="board-container shadow">
        <div class="board-header mb-4 border-bottom pb-3">
            <h4 class="m-0 fw-bold" style="color: #0b1a42;"><i class="fas fa-comments text-primary me-2"></i> Risposte della Community</h4>
        </div>

        <div id="comments-container">
            <!-- Qui ci andranno i futuri commenti -->
            <div class="text-center p-4 fw-bold shadow-sm" style="color: #5c728e; background-color: #f8fbff; border: 2px dashed #c0d3e8; border-radius: 12px;">
                I commenti non sono ancora attivi in questa versione.<br>Presto potrai rispondere!
            </div>
        </div>
    </div>
</div>

<!-- INIZIALIZZAZIONE FIREBASE -->

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJLzxu2tREehzZE79YAK7_TIq1G6lf4Rc",
        authDomain: "inazumaelevencrosshub.firebaseapp.com",
        projectId: "inazumaelevencrosshub",
        storageBucket: "inazumaelevencrosshub.firebasestorage.app",
        messagingSenderId: "100160386925",
        appId: "1:100160386925:web:2f35aaacb877d70c9f4c64",
        measurementId: "G-0R453LFDB0"
    };

    const app = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(app);
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseDb = getFirestore(app);
    window.firebaseLogin = signInWithPopup;
    window.firebaseLogout = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.dbDoc = doc;
    window.dbSet = setDoc;
    window.dbGet = getDoc;
</script>

<!-- SCRIPT DELLA DISCUSSIONE -->
<script type="module" src="js/Controllers/discussion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
