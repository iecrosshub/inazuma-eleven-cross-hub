<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1450">
    <title>Tier List & Build | Inazuma Eleven Cross</title>
    <link rel="icon" type="image/png" href="img/IECross.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleCharacter.css">
    <style>
        /* Stile Tier List Pubblica */
        .tier-row { display: flex; margin-bottom: 10px; border-radius: 8px; overflow: hidden; background-color: #0b1a42; border: 2px solid #1269e8; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .tier-label { width: 120px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); flex-shrink: 0; border-right: 2px solid #1269e8; }
        .tier-S-plus { background-color: #ffc107; color: #000; text-shadow: none; }
        .tier-S { background-color: #dc3545; }
        .tier-A { background-color: #198754; }
        .tier-B { background-color: #0d6efd; }
        .tier-C { background-color: #6c757d; }
        .tier-content { padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; flex-grow: 1; min-height: 95px; }

        .char-icon-btn { cursor: pointer; transition: transform 0.2s; position: relative; }
        .char-icon-btn:hover { transform: scale(1.1); z-index: 10; }
        .char-icon-btn img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; border: 2px solid #c0d3e8; background: linear-gradient(to bottom, #edf3f8 0%, #a4ccf4 100%); }
    </style>
</head>
<body class="pb-5">

<script type="module" src="js/Components/navbar.js"></script>
<inazuma-navbar></inazuma-navbar>

<div class="container-fixed py-4" style="max-width: 1200px !important;">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
        <h2 class="text-white fw-bold m-0" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 2px;">
            <i class="fas fa-list-ol text-info me-2"></i> Tier List & Meta Build
        </h2>

        <!-- Bottone Admin -->
        <button id="btn-toggle-admin" class="btn btn-warning fw-bold shadow" style="display: none;">
            <i class="fas fa-tools me-1"></i> Gestione Admin
        </button>
    </div>

    <!-- PANNELLO ADMIN -->
    <div id="admin-panel-container" style="display: none; margin-bottom: 40px;">
        <div class="card p-4 shadow-lg" style="border: 3px solid #ffc107;">
            <h4 class="fw-bold text-warning border-bottom border-warning pb-2 mb-4"><i class="fas fa-plus-circle me-2"></i> Crea/Modifica Build Personaggio</h4>

            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="fw-bold mb-1 text-dark">Seleziona Personaggio</label>
                    <div class="custom-select" id="build-character" data-value=""></div>
                </div>
                <div class="col-md-4">
                    <label class="fw-bold mb-1 text-dark">Tier Competitivo</label>
                    <!-- FIX: Valori standardizzati senza simboli '+' o nomi vecchi -->
                    <div class="custom-select" id="build-tier" data-value="S">
                        <div class="select-selected"><span class="fw-bold" style="color: #dc3545;">S (Top Meta)</span> <i class="fas fa-chevron-down"></i></div>
                        <div class="select-items select-hide">
                            <div data-value="S-plus"><span class="fw-bold" style="color: #ffc107;">S+ (God Tier)</span></div>
                            <div data-value="S"><span class="fw-bold" style="color: #dc3545;">S (Top Meta)</span></div>
                            <div data-value="A"><span class="fw-bold" style="color: #198754;">A (Ottimo)</span></div>
                            <div data-value="B"><span class="fw-bold" style="color: #0d6efd;">B (Situazionale)</span></div>
                            <div data-value="C"><span class="fw-bold" style="color: #6c757d;">C (Meme/For Fun)</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-12 mt-3">
                    <label class="fw-bold mb-1 text-dark">Descrizione Generale PG</label>
                    <textarea id="build-desc-general" class="form-control" rows="3" placeholder="Spiega perché questo PG si trova in questo Tier..." style="border: 2px solid #c0d3e8; font-weight: 500;"></textarea>
                </div>
            </div>

            <h5 class="fw-bold mb-3 text-primary"><i class="fas fa-dna me-2"></i> Passive Reroll</h5>
            <div class="row g-3 mb-4" id="passives-container"></div>

            <h5 class="fw-bold mb-3 text-primary"><i class="fas fa-fire me-2"></i> Tecnica Aggiuntiva</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-5">
                    <div class="custom-select" id="build-move-select" data-value=""></div>
                </div>
                <div class="col-md-7">
                    <input type="text" id="build-move-desc" class="form-control" placeholder="Spiegazione: Perché insegnargli questa mossa?" style="border: 2px solid #c0d3e8; font-weight: 500; height: 100%;">
                </div>
            </div>

            <div class="text-end border-top pt-3">
                <button id="btn-save-build" class="btn btn-primary fw-bold px-5 fs-5 shadow"><i class="fas fa-save me-2"></i> Pubblica/Aggiorna Build</button>
            </div>
        </div>
    </div>

    <!-- SPINNER CARICAMENTO -->
    <div id="loading-spinner" class="text-center p-5 text-white">
        <i class="fas fa-spinner fa-spin fa-3x"></i><br><h5 class="mt-3">Caricamento Tier List...</h5>
    </div>

    <!-- TIER LIST PUBBLICA: FIX degli ID rimuovendo i + -->
    <div id="tier-list-container" style="display: none;">
        <div class="tier-row"><div class="tier-label tier-S-plus">S+</div><div class="tier-content" id="tier-S-plus"></div></div>
        <div class="tier-row"><div class="tier-label tier-S">S</div><div class="tier-content" id="tier-S"></div></div>
        <div class="tier-row"><div class="tier-label tier-A">A</div><div class="tier-content" id="tier-A"></div></div>
        <div class="tier-row"><div class="tier-label tier-B">B</div><div class="tier-content" id="tier-B"></div></div>
        <div class="tier-row"><div class="tier-label tier-C">C</div><div class="tier-content" id="tier-C"></div></div>
    </div>
</div>

<!-- MODALE VISUALIZZAZIONE BUILD (PUBBLICO) -->
<div class="modal fade" id="buildModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-white" style="border: 3px solid #1a73e8; border-radius: 12px; overflow: hidden;">
            <div class="modal-header" style="background-color: #0b1a42; color: #fff; border-bottom: 2px solid #1a73e8;">
                <h4 class="modal-title fw-bold text-uppercase d-flex align-items-center gap-3">
                    <img id="view-modal-thumb" src="" style="width: 50px; height: 50px; border-radius: 6px; border: 2px solid #fff;">
                    <span id="view-modal-name">Nome PG</span>
                </h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="background-color: #f8fbff; padding: 25px;">

                <div class="mb-4">
                    <h5 class="fw-bold text-primary border-bottom border-primary pb-2"><i class="fas fa-info-circle me-2"></i> Analisi Strategica</h5>
                    <p id="view-modal-general" class="fs-6 fw-bold" style="color: #102247; line-height: 1.5; white-space: pre-wrap;"></p>
                </div>

                <h5 class="fw-bold text-primary border-bottom border-primary pb-2"><i class="fas fa-dna me-2"></i> Passive Consigliate (Reroll)</h5>
                <div id="view-modal-passives" class="d-flex flex-column gap-3 mb-4"></div>

                <div id="view-modal-move-container">
                    <h5 class="fw-bold text-primary border-bottom border-primary pb-2"><i class="fas fa-fire me-2"></i> Mossa Aggiuntiva</h5>
                    <div id="view-modal-move" class="p-3 rounded fw-bold" style="background-color: #e4edf8; border: 1px solid #b0c4de; color: #102247;"></div>
                </div>

            </div>
            <!-- FOOTER CON BOTTONI ADMIN -->
            <div class="modal-footer d-flex justify-content-between" style="background-color: #e4edf8; border-top: 1px solid #b0c4de;">
                <div id="admin-modal-actions" style="display: none; gap: 10px;">
                    <button id="btn-edit-build" class="btn btn-warning fw-bold"><i class="fas fa-edit me-1"></i> Modifica</button>
                    <button id="btn-delete-build" class="btn btn-danger fw-bold"><i class="fas fa-trash me-1"></i> Elimina</button>
                </div>
                <div>
                    <a href="#" id="btn-go-to-char" class="btn btn-primary fw-bold"><i class="fas fa-address-card me-1"></i> Scheda PG</a>
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Chiudi</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    const firebaseConfig = {
        apiKey: "AIzaSyDJLzxu2tREehzZE79YAK7_TIq1G6lf4Rc",
        authDomain: "inazumaelevencrosshub.firebaseapp.com",
        projectId: "inazumaelevencrosshub",
        storageBucket: "inazumaelevencrosshub.firebasestorage.app",
        messagingSenderId: "100160386925",
        appId: "1:100160386925:web:2f35aaacb877d70c9f4c64"

<script type="module" src="js/Controllers/metaBuilds.js"></script>
</body>
</html>
