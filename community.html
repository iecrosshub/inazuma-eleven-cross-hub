<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1450">
    <title>Community | Inazuma Eleven Cross</title>
    <link rel="icon" type="image/png" href="img/IECross.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleCommunity.css">
</head>
<body class="pb-5">

<script type="module" src="js/Components/navbar.js"></script>
<inazuma-navbar></inazuma-navbar>

<div class="container-fixed py-4" style="width: 1000px !important; max-width: 1000px !important;">

    <!-- TITOLO PAGINA CENTRATO -->
    <h2 class="text-white text-center fw-bold mb-4 mt-3" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
        <i class="fas fa-satellite-dish"></i> BACHECA COMMUNITY
    </h2>

    <!-- BARRA UTENTE -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 rounded" style="background: #0b1a42; border: 2px solid #ffca28; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <div style="flex: 1;"></div>
        <div class="text-center" style="flex: 2;">
            <h4 class="m-0 text-white fw-bold" id="user-greeting">Accedi per partecipare alla Community</h4>
        </div>
        <div class="text-end" style="flex: 1;">
            <button id="btn-login" class="btn btn-light px-4 fw-bold text-dark"><i class="fab fa-google me-2 text-danger"></i> Accedi</button>
            <button id="btn-logout" class="btn btn-outline-light px-4 fw-bold" style="display: none;">Esci</button>
        </div>
    </div>

    <!-- BACHECA A STANZE -->
    <div class="board-container shadow">

        <!-- NAVIGAZIONE STANZE -->
        <div class="board-header">
            <h4 class="m-0 fw-bold mb-3" style="color: #0b1a42;"><i class="fas fa-door-open text-primary me-2"></i> Scegli una Stanza</h4>
            <div class="board-category d-flex flex-wrap gap-2">
                <button class="category-btn active" data-filter="general"><i class="fas fa-globe"></i> Generale</button>
                <button class="category-btn" data-filter="invite"><i class="fas fa-user-plus"></i> Codici Invito</button>
                <button class="category-btn" data-filter="club"><i class="fas fa-users"></i> Reclutamento Club</button>
                <button class="category-btn" data-filter="feedback"><i class="fas fa-lightbulb"></i> Problemi/Consigli</button>
                <button class="category-btn" data-filter="teams" style="border-color: #ffca28;"><i class="fas fa-chess-board text-warning"></i> Formazioni</button>
            </div>
        </div>

        <!-- ZONA CREAZIONE POST (Dinamica) -->
        <div class="create-post-box mt-3" id="create-post-area" style="display:none; background-color: #f8fbff; border: 2px dashed #1a73e8;">
            <h5 class="fw-bold mb-3" id="create-post-title" style="color: #0b1a42;">Scrivi un nuovo post</h5>

            <!-- Area Standard (Messaggi e Codici) -->
            <div id="standard-post-ui">
                <div class="row g-3">
                    <div class="col-md-12">
                        <input type="text" id="post-code" class="form-control form-control-sm input-custom mb-2" placeholder="Inserisci qui un Codice Amico/Club (opzionale)">
                        <textarea id="post-text" class="form-control input-custom" rows="2" placeholder="Scrivi il tuo messaggio..." maxlength="200"></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-between align-items-center mt-2">
                        <small class="text-primary fw-bold"><span id="char-count">0</span>/200 caratteri</small>
                        <button id="btn-publish" class="btn btn-primary fw-bold px-4 shadow-sm"><i class="fas fa-paper-plane me-1"></i> Pubblica nella Stanza</button>
                    </div>
                </div>
            </div>

            <!-- Area Team Builder (Se l'utente è nella stanza Formazioni) -->
            <div id="team-post-ui" style="display: none;" class="text-center py-3">
                <p class="mb-3 text-dark fw-bold">Le formazioni non si scrivono a mano, ma si costruiscono visualmente nel Team Builder!</p>
                <a href="teamBuilder.html" class="btn btn-warning text-dark fw-bold px-4 shadow"><i class="fas fa-tools me-2"></i> Vai al Creatore Formazioni</a>
            </div>
        </div>

        <!-- ZONA UTENTE NON LOGGATO -->
        <div id="login-prompt-area" class="text-center p-4 mt-3">
            <p class="fw-bold m-0 fs-5" style="color: #0b1a42;"><i class="fas fa-lock text-warning me-2"></i> Devi accedere per partecipare alle discussioni.</p>
        </div>

        <!-- LISTA POST (Si carica via JS) -->
        <div class="post-list mt-4" id="post-container">
            <!-- I post appariranno qui -->
        </div>
    </div>
</div>

<!-- INIZIALIZZAZIONE FIREBASE -->

    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJLzxu2tREehzZE79YAK7_TIq1G6lf4Rc",
        authDomain: "inazumaelevencrosshub.firebaseapp.com",
        projectId: "inazumaelevencrosshub",
        storageBucket: "inazumaelevencrosshub.firebasestorage.app",
        messagingSenderId: "100160386925",
        appId: "1:100160386925:web:2f35aaacb877d70c9f4c64",
        measurementId: "G-0R453LFDB0"
    };

    const app = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(app);
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseDb = getFirestore(app);
    window.firebaseLogin = signInWithPopup;
    window.firebaseLogout = signOut;
    window.firebaseOnAuth = onAuthStateChanged;
    window.dbDoc = doc;
    window.dbSet = setDoc;
    window.dbGet = getDoc;
</script>

<script type="module" src="js/Controllers/community.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
